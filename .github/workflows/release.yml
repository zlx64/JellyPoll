name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute version from tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          DOTS=$(echo "$V" | tr -cd '.' | wc -c)
          if [ "$DOTS" -lt 3 ]; then V="$V.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build web app (must run before dotnet — SPA is embedded)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish plugin
        run: dotnet publish src/Jellyfin.Plugin.JellyPoll -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Package zip + update manifest
        run: |
          python scripts/package.py \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "artifacts/jellypoll_${{ steps.ver.outputs.version }}.zip" \
            --title "JellyPoll ${{ github.ref_name }}" \
            --generate-notes

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged"
          else
            git commit -m "chore: update plugin manifest for ${{ github.ref_name }}"
            git push origin HEAD:${GITHUB_REF_NAME#refs/heads/} 2>/dev/null || git push origin HEAD:main
          fi
